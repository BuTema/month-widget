name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: month-widget-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # The app checks this release for a newer build (it names the commit in the notes).
      - name: Publish the APK as the "Latest build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk month-widget.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest month-widget.apk --title "Latest build" --prerelease \
            --notes "Automatic build of ${GITHUB_SHA::7}."
